name: Parallax build and integrity checks

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DPT_MINIZIP_REF: dc8531deb704715fa57268d5e144f9eed7c8af66
      DPT_BHOOK_REF: a8bd254f6e53022b65136f40d10ae3763b6ef8ad
      DPT_DOBBY_REF: f2f8a6a825d2c43aea598012b0dc8685eb6f651a
      DPT_MBEDTLS_REF: 068ff080b369adfac81509f9b57b2afabaf82dc5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          EXTERNAL="$GITHUB_WORKSPACE/ParallaxShell/shell/src/main/cpp/external"
          mkdir -p "$EXTERNAL"

          checkout_dep() {
            local name="$1"
            local url="$2"
            local ref="$3"
            local target="$EXTERNAL/$name"
            rm -rf "$target"
            git clone --filter=blob:none --no-checkout "$url" "$target"
            git -C "$target" fetch --depth 1 origin "$ref"
            git -C "$target" checkout --detach FETCH_HEAD
            git -C "$target" submodule update --init --recursive --depth 1
            local actual
            actual=$(git -C "$target" rev-parse HEAD)
            [ "$actual" = "$ref" ]
            echo "$name=$actual"
          }

          clone_info=()
          clone_info+=("$(checkout_dep minizip-ng https://github.com/zlib-ng/minizip-ng "$DPT_MINIZIP_REF")")
          clone_info+=("$(checkout_dep bhook https://github.com/bytedance/bhook.git "$DPT_BHOOK_REF")")
          clone_info+=("$(checkout_dep Dobby https://github.com/luoyesiqiu/Dobby.git "$DPT_DOBBY_REF")")
          clone_info+=("$(checkout_dep mbedtls https://github.com/Mbed-TLS/mbedtls "$DPT_MBEDTLS_REF")")
          printf '%s\n' "${clone_info[@]}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            ParallaxShell/**/*.gradle
            ParallaxShell/**/*.gradle.kts
            ParallaxShell/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.0.12077973'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.31.1"

      - name: Check tool versions
        run: |
          java -version
          javac -version
          cmake --version
          ninja --version

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ParallaxShell

      - name: Clean Gradle build
        run: ./gradlew clean
        working-directory: ParallaxShell

      - name: Build project
        shell: bash
        working-directory: ParallaxShell
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          ./gradlew build --stacktrace --warning-mode all 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/gradle-build.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-build-diagnostics-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -e

          mkdir -p ParallaxShell/executable

          find ParallaxShell/executable \
            -type f \
            ! -name SHA256SUMS \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > ParallaxShell/executable/SHA256SUMS

          sha256sum --check ParallaxShell/executable/SHA256SUMS

      - name: Upload Parallax artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parallax-${{ github.sha }}
          path: ParallaxShell/executable/
          if-no-files-found: error
