import java.security.SecureRandom

plugins {
    id 'com.android.application' version '8.10.0' apply false
}

static def generateHexString() {
    def secureRandom = new SecureRandom()
    return Long.toHexString(secureRandom.nextLong())
}

// Keep the encryption build key stable across the protector and native shell build.
def parallaxBuildIdsFile = file("${rootDir}/build/parallax-build-ids.properties")
def parallaxBuildIds = new Properties()
if (parallaxBuildIdsFile.exists()) {
    parallaxBuildIdsFile.withInputStream { parallaxBuildIds.load(it) }
}
def resolvedSoName = "ParallaxLover"
def resolvedBuildKey = parallaxBuildIds.getProperty("parallaxBuildKey")
if (!resolvedBuildKey || resolvedBuildKey.isEmpty()) {
    resolvedBuildKey = generateHexString()
    parallaxBuildIds.setProperty("parallaxBuildKey", resolvedBuildKey)
    parallaxBuildIdsFile.parentFile.mkdirs()
    parallaxBuildIdsFile.withOutputStream { parallaxBuildIds.store(it, "parallax-shell build ids. Delete to regenerate.") }
}

ext {
    soName = resolvedSoName
    fullSoName = "${soName}.so"
    shellPackageName = generateHexString()
    parallaxBuildKey = resolvedBuildKey

    // Android SDK versions
    compileSdkVersion = 36
    minSdkVersion = 21
    targetSdkVersion = 36

    // App version
    appVersionCode = 1
    appVersionName = "2.18.0"

    // Java compatibility
    shellJavaVersion = JavaVersion.VERSION_1_8
    parallaxJavaVersion = JavaVersion.VERSION_11

    // CMake
    cmakeVersion = "3.31.1"

}

subprojects { sub ->
    sub.afterEvaluate {
        sub.tasks.matching { it.name == 'clean' }.configureEach { task ->
            task.doFirst {
                if (parallaxBuildIdsFile.exists()) {
                    parallaxBuildIdsFile.delete()
                    println("Deleted ${parallaxBuildIdsFile}")
                }
            }
        }
    }
}
